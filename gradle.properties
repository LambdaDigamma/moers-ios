kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx8192M

#Gradle
org.gradle.jvmargs=-Xmx8192m -Dfile.encoding=UTF-8

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true
android.nonFinalResIds=false

#MPP
kotlin.mpp.enableCInteropCommonization=true
org.gradle.configuration-cache=true
#KSP
# Incremental KSP 2.3 with Kotlin 2.4 sometimes dropped all generated Hilt sources of a module
# after classpath changes (for example when switching branches), which produced APKs that crash
# with "Cannot create an instance of ...ViewModel". Full KSP runs avoid this.
ksp.incremental=false
